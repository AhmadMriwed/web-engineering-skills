name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentation and route parser
        run: |
          python3 scripts/validate.py
          python3 -B -m unittest discover -s scripts
      - name: Scan distributable source
        run: python3 scripts/privacy_check.py
      - name: Build and compare two archives
        run: |
          python3 scripts/package_skill.py --output "$RUNNER_TEMP/first"
          python3 scripts/package_skill.py --output "$RUNNER_TEMP/second"
          cmp "$RUNNER_TEMP/first/web-engineering-v0.1.0.zip" "$RUNNER_TEMP/second/web-engineering-v0.1.0.zip"
          cd "$RUNNER_TEMP/first"
          sha256sum -c SHA256SUMS
      - name: Compile and test the neutral TypeScript examples
        run: |
          npm exec --yes --package=typescript@5.9.3 -- tsc --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir "$RUNNER_TEMP/examples" web-engineering/assets/examples/*.ts
          node scripts/validate_examples.cjs "$RUNNER_TEMP/examples"
